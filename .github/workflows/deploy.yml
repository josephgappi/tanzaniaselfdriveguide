
name: Deploy Website to Namecheap

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    name: Check Namecheap FTP Directory
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check FTP Directory
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os
          from ftplib import FTP_TLS

          server = os.environ["FTP_SERVER"]
          username = os.environ["FTP_USERNAME"]
          password = os.environ["FTP_PASSWORD"]

          print("Connecting to Namecheap FTP server...")

          ftp = FTP_TLS(timeout=60)
          ftp.connect(server, 21)
          ftp.auth()
          ftp.login(username, password)
          ftp.prot_p()

          print("\nFTP CONNECTION SUCCESSFUL")
          print("Starting directory:", ftp.pwd())

          print("\nDIRECTORY CONTENTS:")
          ftp.retrlines("LIST")

          print("\nCHECKING POSSIBLE WEBSITE DIRECTORIES:")

          for directory in ["/", "public_html", "/public_html",
                            "../public_html", "../../public_html"]:
              try:
                  ftp.cwd(directory)
                  print("Accessible:", directory, "=>", ftp.pwd())
                  ftp.cwd("/")
              except Exception as error:
                  print("Not accessible:", directory, "-", error)

          ftp.quit()
          print("\nFTP DIRECTORY CHECK COMPLETED.")
          PY
