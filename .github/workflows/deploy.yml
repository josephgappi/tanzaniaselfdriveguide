
name: Deploy Website to Namecheap

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    name: Diagnose Namecheap FTP Connection
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify FTP Server DNS
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        run: |
          python3 - <<'PY'
          import os
          import socket

          host = os.environ["FTP_SERVER"].strip()

          print("FTP hostname:", host)

          try:
              results = socket.getaddrinfo(
                  host, 21, type=socket.SOCK_STREAM
              )

              for result in results:
                  print("Resolved IP:", result[4][0])

              print("DNS CHECK SUCCESSFUL")

          except Exception as error:
              print("DNS CHECK FAILED:", error)
              raise
          PY

      - name: Test Namecheap FTPS Connection
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os
          from ftplib import FTP_TLS

          server = os.environ["FTP_SERVER"].strip()
          username = os.environ["FTP_USERNAME"]
          password = os.environ["FTP_PASSWORD"]

          print("Connecting to Namecheap:", server)

          ftp = FTP_TLS(timeout=60)

          try:
              ftp.connect(server, 21)
              print("FTP SERVER CONNECTION SUCCESSFUL")

              ftp.auth()
              print("TLS ENCRYPTION SUCCESSFUL")

              ftp.login(username, password)
              print("FTP LOGIN SUCCESSFUL")

              ftp.prot_p()
              print("SECURE DATA CONNECTION ENABLED")

              print("\nSTARTING DIRECTORY:")
              print(ftp.pwd())

              print("\nDIRECTORY CONTENTS:")
              ftp.retrlines("LIST")

              print("\nCHECKING WEBSITE DIRECTORIES:")

              directories = [
                  "/",
                  "/public_html",
                  "public_html",
                  "/home/tanzgupn/public_html"
              ]

              for directory in directories:
                  try:
                      ftp.cwd(directory)
                      print("ACCESSIBLE:", directory)
                      print("ACTUAL PATH:", ftp.pwd())
                      ftp.cwd("/")
                  except Exception as error:
                      print("NOT ACCESSIBLE:", directory)
                      print("Reason:", error)

              ftp.quit()
              print("\nFTP DIAGNOSTIC COMPLETED SUCCESSFULLY")

          except Exception as error:
              print("\nFTP DIAGNOSTIC FAILED:", error)
              try:
                  ftp.close()
              except Exception:
                  pass
              raise
          PY
