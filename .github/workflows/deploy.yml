
name: Deploy Website to Namecheap

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    name: Upload Website to Namecheap
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify FTP Server DNS
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        run: |
          python3 - <<'PY'
          import os
          import socket

          host = os.environ["FTP_SERVER"].strip()

          print("FTP hostname:", host)

          results = socket.getaddrinfo(
              host, 21, type=socket.SOCK_STREAM
          )

          for result in results:
              print("Resolved IP:", result[4][0])

          print("DNS CHECK SUCCESSFUL")
          PY

      - name: Upload Website to Namecheap
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          timeout: 120000
          local-dir: ./
          server-dir: /public_html/
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/.env
            **/README.md
